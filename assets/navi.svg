<?xml version="1.0" encoding="UTF-8"?>
<!-- hey-listen logo: a minimal "Navi"-style fairy — a glowing cyan orb with
     four translucent wings and a few sparkles. Transparent background so it
     works as a window icon and on any page. viewBox is 256x256, orb centered. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- The orb's glow: bright white core -> cyan -> fully transparent edge. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#eaffff" stop-opacity="1"/>
      <stop offset="42%" stop-color="#3ad9ff" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#1f9fe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f9fe0" stop-opacity="0"/>
    </radialGradient>
    <!-- The tiny hot core. -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbf6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Wing fill: pale cyan, translucent, fading toward the tip. -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#dffbff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5fd8ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Four wings, fanned out behind the orb (rotated copies of one ellipse). -->
  <g stroke="#bff4ff" stroke-opacity="0.35" stroke-width="1.5">
    <g transform="rotate(-32 128 128)"><ellipse cx="176" cy="128" rx="46" ry="19" fill="url(#wing)"/></g>
    <g transform="rotate( 32 128 128)"><ellipse cx="176" cy="128" rx="46" ry="19" fill="url(#wing)"/></g>
    <g transform="rotate(148 128 128)"><ellipse cx="176" cy="128" rx="46" ry="19" fill="url(#wing)"/></g>
    <g transform="rotate(212 128 128)"><ellipse cx="176" cy="128" rx="46" ry="19" fill="url(#wing)"/></g>
  </g>

  <!-- The glowing orb. -->
  <circle cx="128" cy="128" r="66" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="30" fill="url(#core)"/>
  <circle cx="120" cy="120" r="9" fill="#ffffff" fill-opacity="0.9"/>

  <!-- A few 4-point sparkles. -->
  <g fill="#eaffff">
    <path d="M60 60 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.9"/>
    <path d="M198 78 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" opacity="0.8"/>
    <path d="M176 190 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" opacity="0.7"/>
  </g>
</svg>
